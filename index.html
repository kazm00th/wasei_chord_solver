<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>和声記号 構成音導出ツール</title>
<style>
  body { font-family: sans-serif; max-width: 800px; margin: 2em auto; }
  fieldset { margin-bottom: 1em; }
  .inner-level { border: 1px solid #ccc; padding: 0.5em; margin-bottom: 0.5em; }
  #result { white-space: pre-wrap; background: #f5f5f5; padding: 1em; }
  .error { color: #c00; }
  .warn { background: #fff8e1; border-left: 4px solid #e6a700; padding: 0.6em 0.8em;
          margin-bottom: 0.8em; color: #6b4e00; white-space: normal; }
  #tengi { margin-top: 1em; }
  #tengi table { border-collapse: collapse; }
  #tengi td { border: 1px solid #ddd; padding: 0.2em 0.6em; }
  #tengi td.key { text-align: right; font-family: monospace; }
  #tengi tr.input { background: #fffbe6; font-weight: bold; }
  #tengi tr.same-key { background: #f4f8ff; }
  #tengi .note { color: #666; font-size: 0.9em; margin: 0.4em 0; }
  #mainKeyName { margin-top: 0.4em; font-size: 1.1em; }
  #mainKeyName .name { font-weight: bold; }
  #mainKeyName .bad { color: #c00; font-weight: normal; font-size: 0.9em; }
</style>
</head>
<body>
<h1>和声記号 構成音導出ツール</h1>

<fieldset>
  <legend>主調</legend>
  五度圏インデックス: <input type="number" id="mainKeyIndex" value="0">
  質:
  <select id="mainKeyQuality">
    <option value="major">長調</option>
    <option value="minor">短調</option>
  </select>
  <div id="mainKeyName"></div>
</fieldset>

<fieldset>
  <legend>内部調の入れ子（外側→内側の順）</legend>
  <div id="innerChainContainer"></div>
  <button type="button" id="addInnerLevel">＋ 内部調を追加</button>
</fieldset>

<fieldset>
  <legend>和音</legend>
  度数: <select id="chordDegree">
    <option>I</option><option>II</option><option>III</option><option>IV</option>
    <option>V</option><option>VI</option><option>VII</option>
  </select>
  特殊形: <select id="chordSpecial">
    <option value="">なし</option>
    <option value="quasi">準（長調のみ）</option>
    <option value="napoli">ナポリ（短調のみ）</option>
    <option value="quasiNapoli">準ナポリ（長調のみ）</option>
    <option value="doric">ドリア</option>
    <option value="raisedVII">変位VII</option>
  </select>
  <br>
  <label><input type="checkbox" id="formSeventh"> 7度</label>
  <label><input type="checkbox" id="formNinth"> 9度</label>
  <label><input type="checkbox" id="formAdd6"> 付加6</label>
  <label><input type="checkbox" id="formAdd4"> 付加4</label>
  <br>
  <label><input type="checkbox" id="alterationUp"> 上変</label>
  <label><input type="checkbox" id="alterationDown"> 下変</label>
  <br>
  <label><input type="checkbox" id="omissionRoot"> 根省</label>
  <label><input type="checkbox" id="omissionFifth"> 5省</label>
  <br>
  転回: <input type="number" id="inversion" value="0" min="0">
</fieldset>

<button type="button" id="calculate">構成音を導出</button>

<div id="result"></div>
<div id="tengi"></div>

<script src="core.js"></script>
<script src="catalog.js"></script>
<script src="tengi.js"></script>
<script>
"use strict";

function addInnerLevel() {
  const container = document.getElementById("innerChainContainer");
  const div = document.createElement("div");
  div.className = "inner-level";
  div.innerHTML = `
    度数: <select class="level-degree">
      <option>I</option><option>II</option><option>III</option><option>IV</option>
      <option>V</option><option>VI</option><option>VII</option>
      <option value="napoliII">ナポリII</option>
      <option value="raisedVII">変位VII</option>
    </select>
    表: <select class="level-table">
      <option value="auto">通常</option>
      <option value="quasi">準</option>
      <option value="relative">同主</option>
    </select>
    強制質: <select class="level-force">
      <option value="">なし</option>
      <option value="major">プラス（長）</option>
      <option value="minor">マイナス（短）</option>
    </select>
    <button type="button" class="remove-level">×削除</button>
  `;
  div.querySelector(".remove-level").addEventListener("click", () => div.remove());
  container.appendChild(div);
}

function readInnerChain() {
  const levels = document.querySelectorAll(".inner-level");
  return Array.from(levels).map((div) => ({
    degree: div.querySelector(".level-degree").value,
    table: div.querySelector(".level-table").value,
    forceQuality: div.querySelector(".level-force").value || null
  }));
}

function calculate() {
  const spec = {
    mainKey: {
      index: parseInt(document.getElementById("mainKeyIndex").value, 10),
      quality: document.getElementById("mainKeyQuality").value
    },
    innerChain: readInnerChain(),
    chord: {
      degree: document.getElementById("chordDegree").value,
      special: document.getElementById("chordSpecial").value || null,
      form: {
        seventh: document.getElementById("formSeventh").checked,
        ninth: document.getElementById("formNinth").checked,
        add6: document.getElementById("formAdd6").checked,
        add4: document.getElementById("formAdd4").checked
      },
      alteration: {
        up: document.getElementById("alterationUp").checked,
        down: document.getElementById("alterationDown").checked
      },
      omission: {
        root: document.getElementById("omissionRoot").checked,
        fifth: document.getElementById("omissionFifth").checked
      },
      inversion: parseInt(document.getElementById("inversion").value, 10)
    }
  };

  const result = WaseiCore.deriveChord(spec);
  const resultDiv = document.getElementById("result");
  const tengiDiv = document.getElementById("tengi");
  if (result.error) {
    resultDiv.innerHTML = `<span class="error">エラー: ${result.error}</span>`;
    tengiDiv.innerHTML = "";
    return;
  }
  const esc0 = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const warn = (result.warnings || []).length
    ? '<div class="warn">' + result.warnings.map((w) => "⚠ " + esc0(w)).join("<br>") + "</div>"
    : "";
  resultDiv.innerHTML = warn + esc0(
    "構成音: " + result.notes.join(", ") + "\n" +
    "ピッチクラス: " + result.pcs.join(", ") + "\n\n" +
    "導出ステップ:\n" + result.steps.join("\n")
  );
  renderTengi(result, spec);
}

// 転義表はページ読み込み時に1度だけ組む（106件×deriveChord）。
let tengiTable = null;

function renderTengi(result, spec) {
  const div = document.getElementById("tengi");
  if (!tengiTable) tengiTable = WaseiTengi.buildTable(WaseiCatalog.CATALOG, WaseiCore.deriveChord);

  const out = WaseiTengi.lookup(
    result.pcs,
    tengiTable,
    WaseiCore.indexToPitchClass(spec.mainKey.index),
    spec.mainKey.quality,
    spec
  );

  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  let html = "<h2>転義可能性</h2>";

  if (!out.found) {
    html += '<p class="note">この構成音は『総合和声』の和音カタログ（106件）にありません。'
      + "転義先は求められません。</p>";
    div.innerHTML = html;
    return;
  }

  // 「読み替えが無い」かどうかは、カタログのグループが1件かどうかではなく
  // **入力以外の行が出るかどうか**で決める。入力がカタログに無い和音のときは、
  // グループが1件（孤立）でもその1件は立派な読み替え先になる
  // （例: C Dur の I度9 は G Dur の IV度9。I度9 自体はカタログに無い）。
  const others = out.rows.filter((r) => !r.isInput).length;

  if (others === 0) {
    html += '<p class="note">なし（<b>孤立した和音</b>——移調しても他の和音に読み替えられません）。</p>';
  } else {
    html += `<p class="note">${others} 件の読み替えがあります`
      + (out.period < 12
        ? `（この構成音は ${out.period} 半音ごとに自分自身に重なるので、各記号が ${12 / out.period} つの調に現れます）`
        : "")
      + "。</p>";
  }

  html += "<table>";
  for (const r of out.rows) {
    const mark = r.isInput ? "← 入力" : r.sameKey ? "（同じ調の別の読み）" : "";
    html += `<tr class="${r.isInput ? "input" : r.sameKey ? "same-key" : ""}">`
      + `<td class="key">${esc(r.key)}</td><td>${esc(r.symbol)}</td>`
      + `<td>${mark}</td></tr>`;
  }
  html += "</table>";
  div.innerHTML = html;
}

// 主調をドイツ音名で表示する。五度圏インデックスがそのまま主音の位置なので
// indexToNoteName で綴りが決まる（長調は大文字、短調は小文字）。
function renderMainKeyName() {
  const raw = document.getElementById("mainKeyIndex").value;
  const div = document.getElementById("mainKeyName");
  const index = parseInt(raw, 10);
  if (raw.trim() === "" || Number.isNaN(index)) {
    div.innerHTML = '<span class="bad">五度圏インデックスを入力してください</span>';
    return;
  }
  const quality = document.getElementById("mainKeyQuality").value;
  const tonic = WaseiCore.indexToNoteName(index);
  const name = quality === "major" ? `${tonic} Dur` : `${tonic.toLowerCase()} Moll`;
  div.innerHTML = `主調: <span class="name">${name}</span>`;
}

document.getElementById("addInnerLevel").addEventListener("click", addInnerLevel);
document.getElementById("calculate").addEventListener("click", calculate);
document.getElementById("mainKeyIndex").addEventListener("input", renderMainKeyName);
document.getElementById("mainKeyQuality").addEventListener("change", renderMainKeyName);
renderMainKeyName();
</script>
</body>
</html>
